input {
  http {
    port => 5044
    codec => json
  }
  
  file {
    path => "/var/log/neuropredict/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  if [fields][log_type] == "security" {
    mutate {
      add_field => { "[@metadata][index]" => "security-logs" }
    }
  } else if [fields][log_type] == "audit" {
    mutate {
      add_field => { "[@metadata][index]" => "audit-logs" }
    }
  } else {
    mutate {
      add_field => { "[@metadata][index]" => "application-logs" }
    }
  }
  
  date {
    match => [ "timestamp", "ISO8601" ]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index]}-%{+YYYY.MM.dd}"
  }
  
  stdout {
    codec => rubydebug
  }
}

