# Minimal Prometheus config for docker-compose.yml (development).
# Scrapes the FastAPI Prometheus registry exposed at GET /metrics.
# Optional exporters: enable profile `monitoring` and use prometheus-advanced.yml.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: neuropredict-backend
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: backend
          env: development
