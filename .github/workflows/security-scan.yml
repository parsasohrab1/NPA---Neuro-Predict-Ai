name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  python-security:
    name: Python security tools
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install scanning tools
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] safety semgrep pip-audit

      - name: Prepare reports directory
        run: mkdir -p backend/security_reports

      - name: Bandit (SAST)
        working-directory: backend
        run: bandit -r app -f json -o security_reports/bandit_report.json -lll
        continue-on-error: true

      - name: Safety (dependency CVEs)
        working-directory: backend
        run: safety check --json --output security_reports/safety_report.json -r requirements.txt
        continue-on-error: true

      - name: pip-audit
        working-directory: backend
        run: pip-audit -r requirements.txt --format json --output security_reports/pip_audit_report.json
        continue-on-error: true

      - name: Semgrep (SAST)
        working-directory: backend
        run: semgrep --config=auto --json --output=security_reports/semgrep_report.json app
        continue-on-error: true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-security-reports
          path: backend/security_reports/
