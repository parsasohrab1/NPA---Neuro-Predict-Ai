name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit
      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: backend
        run: |
          pytest -q
      - name: Python SAST (bandit)
        working-directory: backend
        run: |
          bandit -q -r app || true

  frontend-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: npm audit (prod)
        working-directory: frontend
        run: npm audit --audit-level=high || true

  admin-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: admin-dashboard/package-lock.json
      - name: Install deps
        working-directory: admin-dashboard
        run: npm ci
      - name: Type check / Lint
        working-directory: admin-dashboard
        run: npm run lint
      - name: Build
        working-directory: admin-dashboard
        run: npm run build
      - name: npm audit (prod)
        working-directory: admin-dashboard
        run: npm audit --audit-level=high || true

  build-and-push-images:
    needs: [backend-lint-test, frontend-lint-build, admin-lint-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}-backend:latest
      - name: Build & Push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}-frontend:latest
      - name: Build & Push admin-dashboard image
        uses: docker/build-push-action@v5
        with:
          context: ./admin-dashboard
          file: ./admin-dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-admin:${{ github.sha }}
            ghcr.io/${{ github.repository }}-admin:latest

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: neuropredict_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/neuropredict_db
      DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/neuropredict_db
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SECRET_KEY: test_secret_key_test_secret_key_test_secret
      ENVIRONMENT: test
      DEBUG: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Lint (bandit - SAST high/critical must be zero)
        run: |
          pip install bandit
          bandit -q -r backend/app -lll
      - name: Run tests
        working-directory: backend
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report (backend)
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            admin-dashboard/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: npm audit (frontend) - high severity
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high || true
      - name: Install admin-dashboard deps
        working-directory: admin-dashboard
        run: npm ci
      - name: Build admin-dashboard
        working-directory: admin-dashboard
        run: npm run build
      - name: npm audit (admin-dashboard) - high severity (fail on high)
        working-directory: admin-dashboard
        run: npm audit --audit-level=high

  security:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --no-banner --source . --report-format sarif --report-path gitleaks.sarif
        continue-on-error: true
      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif

  dast:
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      backend:
        image: tiangolo/uvicorn-gunicorn-fastapi:python3.11
        ports:
          - 8000:80
        env:
          MODULE_NAME: app.main
          VARIABLE_NAME: app
    steps:
      - uses: actions/checkout@v4
      - name: ZAP Baseline Scan (light)
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: false
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        working-directory: backend
        run: docker build -t neuropredict/backend:ci-${{ github.sha }} .
      - name: Build frontend image
        working-directory: frontend
        run: docker build -t neuropredict/frontend:ci-${{ github.sha }} .
      - name: Build admin-dashboard image
        working-directory: admin-dashboard
        run: docker build -t neuropredict/admin:ci-${{ github.sha }} .

  licenses:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      # Backend licenses with pip-licenses
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate backend license report
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-licenses
          pip-licenses --format=markdown --with-authors --with-urls --with-license-file > backend_third_party_licenses.md
      - name: Upload backend license report
        uses: actions/upload-artifact@v4
        with:
          name: backend_third_party_licenses
          path: backend/backend_third_party_licenses.md
      # Frontend licenses with license-checker
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate frontend license report
        working-directory: frontend
        run: |
          npm ci
          npx license-checker --production --json > frontend_third_party_licenses.json
      - name: Upload frontend license report
        uses: actions/upload-artifact@v4
        with:
          name: frontend_third_party_licenses
          path: frontend/frontend_third_party_licenses.json
      - name: Generate admin-dashboard license report
        working-directory: admin-dashboard
        run: |
          npm ci
          npx license-checker --production --json > admin_dashboard_third_party_licenses.json
      - name: Upload admin-dashboard license report
        uses: actions/upload-artifact@v4
        with:
          name: admin_dashboard_third_party_licenses
          path: admin-dashboard/admin_dashboard_third_party_licenses.json

