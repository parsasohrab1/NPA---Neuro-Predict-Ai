name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, test, SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: neuropredict_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/neuropredict_test
      DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/neuropredict_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SECRET_KEY: ci_test_secret_key_ci_test_secret_key_ci_test_secret
      ENVIRONMENT: test
      DEBUG: "false"
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pip-audit

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app

      - name: Static analysis (bandit, fail on HIGH severity)
        working-directory: backend
        run: bandit -q -r app -lll

      - name: Dependency vulnerability scan (pip-audit)
        working-directory: backend
        # Strict: fails on any known CVE; allow-list with --ignore-vuln when justified.
        run: pip-audit -r requirements.txt --strict

      - name: Run smoke tests (must pass)
        working-directory: backend
        run: pytest tests/test_smoke.py -q --no-cov

      - name: Run unit tests with coverage
        working-directory: backend
        run: |
          pytest tests/ \
            --ignore=tests/e2e \
            --ignore=tests/integration \
            --ignore=tests/performance \
            -q \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=40

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, admin-dashboard]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.project }}
        run: npm run lint --if-present

      - name: Type check
        working-directory: ${{ matrix.project }}
        run: npm run typecheck --if-present

      - name: Test
        working-directory: ${{ matrix.project }}
        run: npm test --if-present -- --run

      - name: Build
        working-directory: ${{ matrix.project }}
        run: npm run build

      - name: npm audit (high severity blocks PR)
        working-directory: ${{ matrix.project }}
        run: npm audit --omit=dev --audit-level=high

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: neuropredict/backend:ci-${{ github.sha }}
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: neuropredict/frontend:ci-${{ github.sha }}
      - name: Build admin-dashboard image
        uses: docker/build-push-action@v5
        with:
          context: ./admin-dashboard
          file: ./admin-dashboard/Dockerfile
          push: false
          tags: neuropredict/admin:ci-${{ github.sha }}
