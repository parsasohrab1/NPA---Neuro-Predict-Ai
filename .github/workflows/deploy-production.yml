name: Deploy to Production

# Gated production workflow — workflow_dispatch only (no push-to-main auto-deploy).
# Validates repo paths, runs security scan + tests, checks infra/k8s dry-run.
# Does NOT push images or apply to a cluster without credentials (TODO).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment label"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      image_tag:
        description: "Image tag to validate (defaults to github.sha)"
        required: false
        default: ""
      confirm:
        description: "Type 'deploy' to acknowledge gated intent"
        required: true

concurrency:
  group: deploy-production-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "::error::Set confirm=deploy to run this gated workflow"
            exit 1
          fi

  security-scan:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Run security scan
        working-directory: backend
        run: |
          pip install bandit[toml] safety
          python scripts/security_scan.py

  build-and-test:
    needs: security-scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: neuropredict_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/neuropredict_test
      DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/neuropredict_test
      SECRET_KEY: ci_deploy_secret_key_ci_deploy_secret_key_ci
      ENVIRONMENT: test
      DEBUG: "false"
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # Fixed path: repo root is the workspace (not ./NPA---Neuro-Predict-Ai/...)
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run smoke + unit tests
        working-directory: backend
        run: |
          pytest tests/test_smoke.py -q --no-cov
          pytest tests/ \
            --ignore=tests/e2e \
            --ignore=tests/integration \
            --ignore=tests/performance \
            -q --cov=app --cov-fail-under=40

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images (no push)
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.sha }}"; fi
          docker build -t neuropredict/backend:${TAG} ./backend
          docker build -t neuropredict/frontend:${TAG} ./frontend
          docker build -t neuropredict/admin:${TAG} ./admin-dashboard
          echo "Built neuropredict/{backend,frontend,admin}:${TAG} locally in CI (not pushed)."
          echo "TODO: docker login + push when registry credentials are configured."

  k8s-dry-check:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.29.0"
      - name: Client dry-run infra/k8s
        working-directory: infra/k8s
        run: |
          set -euo pipefail
          for f in *.yaml; do
            case "$f" in
              secrets-template.yaml) echo "skip template $f"; continue ;;
            esac
            echo "==> $f"
            kubectl apply --dry-run=client -f "$f"
          done

  deploy:
    needs: [build-and-test, k8s-dry-check]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Block fake success deploy
        run: |
          echo "::notice::Build/test and k8s dry-run completed for ${{ inputs.environment }}."
          echo "::warning::Cluster credentials are NOT configured."
          echo "TODO: add KUBECONFIG (or cloud IAM) secret, then:"
          echo "  kubectl set image deployment/neuropredict-backend ... -n neuropredict"
          echo "  kubectl rollout status deployment/neuropredict-backend -n neuropredict"
          echo "Refusing to report a successful production deploy."
          exit 1
