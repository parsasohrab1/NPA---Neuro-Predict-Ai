name: Deploy to Production

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run security scan
        run: |
          cd backend
          pip install bandit[toml] safety
          python scripts/security_scan.py

  build-and-test:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        working-directory: ./NPA---Neuro-Predict-Ai/backend
        run: pip install -r requirements.txt
      
      - name: Run tests
        working-directory: ./NPA---Neuro-Predict-Ai/backend
        run: pytest tests/ --cov=app --cov-fail-under=80
      
      - name: Build Docker image
        run: |
          docker build -t neuropredict-ai/backend:${{ github.sha }} ./NPA---Neuro-Predict-Ai/backend
          docker build -t neuropredict-ai/frontend:${{ github.sha }} ./NPA---Neuro-Predict-Ai/frontend
      
      - name: Push to registry
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push neuropredict-ai/backend:${{ github.sha }}
          docker push neuropredict-ai/frontend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://neuropredict-ai.com
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to Kubernetes
        run: |
          echo "Deployment steps would go here"
          # kubectl set image deployment/neuropredict-backend backend=neuropredict-ai/backend:${{ github.sha }} -n neuropredict-ai
      
      - name: Verify deployment
        run: |
          echo "Verification steps would go here"
          # kubectl rollout status deployment/neuropredict-backend -n neuropredict-ai

