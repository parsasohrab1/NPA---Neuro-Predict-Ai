name: Deploy to Production

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/neuropredict
  K8S_NAMESPACE: neuropredict

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: neuropredict_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/neuropredict_test
      DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/neuropredict_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SECRET_KEY: ci_test_secret_key_ci_test_secret_key_ci_test_secret
      ENVIRONMENT: test
      DEBUG: "false"
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: |
          pytest tests/ \
            --ignore=tests/e2e \
            --ignore=tests/integration \
            --ignore=tests/performance \
            -q \
            --cov=app \
            --cov-fail-under=40

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        if: github.event_name != 'pull_request'
        run: |
          TAG="${{ github.sha }}"
          for component in backend frontend admin-dashboard; do
            image="${{ env.IMAGE_PREFIX }}-${component}:${TAG}"
            docker build -t "${image}" -t "${{ env.IMAGE_PREFIX }}-${component}:latest" "./${component}"
            docker push "${image}"
            docker push "${{ env.IMAGE_PREFIX }}-${component}:latest"
          done

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "${KUBE_CONFIG}" ]; then
            echo "KUBE_CONFIG secret is not set. Skipping cluster deploy."
            exit 0
          fi
          mkdir -p "${HOME}/.kube"
          echo "${KUBE_CONFIG}" | base64 -d > "${HOME}/.kube/config"

      - name: Apply base manifests
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ ! -f "${HOME}/.kube/config" ]; then
            echo "No kubeconfig configured."
            exit 0
          fi
          kubectl apply -f infra/k8s/namespace.yaml
          kubectl apply -f infra/k8s/configmaps.yaml
          kubectl apply -f infra/k8s/persistentvolumes.yaml
          kubectl apply -f infra/k8s/postgres-statefulset.yaml
          kubectl apply -f infra/k8s/redis-deployment.yaml

      - name: Roll out application images
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ ! -f "${HOME}/.kube/config" ]; then
            echo "No kubeconfig configured."
            exit 0
          fi
          kubectl apply -f infra/k8s/backend-deployment.yaml
          kubectl apply -f infra/k8s/frontend-deployment.yaml
          kubectl apply -f infra/k8s/network-policies.yaml
          kubectl apply -f infra/k8s/ingress.yaml

          kubectl set image deployment/neuropredict-backend \
            backend=${{ env.IMAGE_PREFIX }}-backend:${IMAGE_TAG} \
            -n ${{ env.K8S_NAMESPACE }} --record
          kubectl set image deployment/neuropredict-frontend \
            frontend=${{ env.IMAGE_PREFIX }}-frontend:${IMAGE_TAG} \
            -n ${{ env.K8S_NAMESPACE }} --record
          kubectl set image deployment/neuropredict-admin \
            admin=${{ env.IMAGE_PREFIX }}-admin-dashboard:${IMAGE_TAG} \
            -n ${{ env.K8S_NAMESPACE }} --record

          kubectl rollout status deployment/neuropredict-backend -n ${{ env.K8S_NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/neuropredict-frontend -n ${{ env.K8S_NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/neuropredict-admin -n ${{ env.K8S_NAMESPACE }} --timeout=300s

      - name: Verify deployment
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ ! -f "${HOME}/.kube/config" ]; then
            echo "Deploy skipped: configure KUBE_CONFIG secret to enable Kubernetes rollout."
            exit 0
          fi
          kubectl get pods,svc,ingress -n ${{ env.K8S_NAMESPACE }}
