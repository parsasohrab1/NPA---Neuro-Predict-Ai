# Prometheus Alert Rules for NeuroPredict-AI

groups:
  - name: system_alerts
    interval: 30s
    rules:
      # System Down
      - alert: SystemDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} has been down for more than 1 minute"

      # High Error Rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status_code=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second"

      # High Latency
      - alert: HighLatency
        expr: histogram_quantile(0.95, http_request_duration_seconds_bucket) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency detected"
          description: "P95 latency is {{ $value }} seconds"

      # Prediction Latency Too High
      - alert: PredictionLatencyHigh
        expr: histogram_quantile(0.95, prediction_duration_seconds_bucket) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prediction latency too high"
          description: "P95 prediction latency is {{ $value }} seconds (target: <3s)"

  - name: ai_ml_alerts
    interval: 30s
    rules:
      # Model Drift Detected
      - alert: ModelDrift
        expr: model_drift_score > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Model drift detected"
          description: "Model drift score is {{ $value }} (threshold: 0.3)"

      # Low Prediction Confidence
      - alert: LowPredictionConfidence
        expr: avg(prediction_confidence_score) < 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Low prediction confidence"
          description: "Average confidence score is {{ $value }}"

  - name: infrastructure_alerts
    interval: 30s
    rules:
      # Database Connection Pool Exhausted
      - alert: DatabaseConnectionsHigh
        expr: database_connections_active / (database_connections_active + database_connections_idle) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "{{ $value }}% of database connections are active"

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value | humanizePercentage }}"

      # High CPU Usage
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}%"

      # Disk Space Low
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space low"
          description: "Only {{ $value | humanizePercentage }} disk space remaining"

  - name: security_alerts
    interval: 30s
    rules:
      # High Failed Login Attempts
      - alert: HighFailedLogins
        expr: rate(errors_total{error_type="authentication_failure"}[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High number of failed login attempts"
          description: "{{ $value }} failed logins per second detected"

      # Brute Force Attack
      - alert: BruteForceAttack
        expr: rate(errors_total{error_type="authentication_failure"}[1m]) > 10
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Possible brute force attack detected"
          description: "{{ $value }} failed logins per second"

