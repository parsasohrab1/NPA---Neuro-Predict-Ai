name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: neuropredict_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      working-directory: ./NPA---Neuro-Predict-Ai/backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Unit Tests
      working-directory: ./NPA---Neuro-Predict-Ai/backend
      run: |
        pytest tests/unit/ -m unit -v --cov=app --cov-report=xml --cov-report=html
    
    - name: Run Integration Tests
      working-directory: ./NPA---Neuro-Predict-Ai/backend
      run: |
        pytest tests/integration/ -m integration -v
    
    - name: Run E2E Tests
      working-directory: ./NPA---Neuro-Predict-Ai/backend
      run: |
        pytest tests/e2e/ -m e2e -v
    
    - name: Run Security Tests
      working-directory: ./NPA---Neuro-Predict-Ai/backend
      run: |
        pytest tests/security/ -m security -v
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./NPA---Neuro-Predict-Ai/backend/coverage.xml
        flags: unittests
        name: codecov-umbrella
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: ./NPA---Neuro-Predict-Ai/backend/htmlcov/

