apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuropredict-frontend
  labels:
    app: neuropredict
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: neuropredict
      tier: frontend
  template:
    metadata:
      labels:
        app: neuropredict
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: neuropredict/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: VITE_API_URL
              value: "http://backend:8000"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: neuropredict
    tier: frontend
spec:
  selector:
    app: neuropredict
    tier: frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP


