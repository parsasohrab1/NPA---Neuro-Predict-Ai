---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuropredict-backend
  namespace: neuropredict
  labels:
    app: neuropredict
    tier: backend
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: neuropredict
      tier: backend
  template:
    metadata:
      labels:
        app: neuropredict
        tier: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/api/v1/monitoring/metrics/prometheus"
    spec:
      serviceAccountName: neuropredict-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: neuropredict/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            # ConfigMap values
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: neuropredict-backend-config
                  key: ENVIRONMENT
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: neuropredict-backend-config
                  key: DEBUG
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: neuropredict-backend-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: neuropredict-backend-config
                  key: REDIS_PORT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: neuropredict-backend-config
                  key: LOG_LEVEL
            
            # Secret values
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: neuropredict-secrets
                  key: DATABASE_URL
            - name: DATABASE_URL_SYNC
              valueFrom:
                secretKeyRef:
                  name: neuropredict-secrets
                  key: DATABASE_URL_SYNC
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: neuropredict-secrets
                  key: SECRET_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: neuropredict-secrets
                  key: JWT_SECRET_KEY
          
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: models
              mountPath: /app/models
            - name: tmp
              mountPath: /tmp
          
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: neuropredict-uploads-pvc
        - name: models
          persistentVolumeClaim:
            claimName: neuropredict-models-pvc
        - name: tmp
          emptyDir: {}
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - neuropredict
                    - key: tier
                      operator: In
                      values:
                        - backend
                topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: neuropredict
  labels:
    app: neuropredict
    tier: backend
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  selector:
    app: neuropredict
    tier: backend
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: neuropredict-backend
  namespace: neuropredict

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: neuropredict-backend-pdb
  namespace: neuropredict
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: neuropredict
      tier: backend

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neuropredict-backend-hpa
  namespace: neuropredict
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neuropredict-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max


