# ⚠️ Template file for secrets
# DO NOT commit actual secrets to version control
# Create actual secrets using kubectl or sealed-secrets

---
apiVersion: v1
kind: Secret
metadata:
  name: neuropredict-secrets
  namespace: neuropredict
type: Opaque
stringData:
  # Database URLs
  DATABASE_URL: "postgresql+asyncpg://USER:PASSWORD@postgres:5432/neuropredict_db"
  DATABASE_URL_SYNC: "postgresql://USER:PASSWORD@postgres:5432/neuropredict_db"
  
  # Database credentials
  POSTGRES_USER: "neuropredict_user"
  POSTGRES_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"
  
  # Application secrets
  SECRET_KEY: "CHANGE_ME_STRONG_SECRET_KEY_MIN_32_CHARS"
  JWT_SECRET_KEY: "CHANGE_ME_JWT_SECRET_KEY"
  JWT_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    YOUR_RSA_PRIVATE_KEY_HERE
    -----END PRIVATE KEY-----
  JWT_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    YOUR_RSA_PUBLIC_KEY_HERE
    -----END PUBLIC KEY-----
  
  # Redis password (if using password)
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"
  
  # Email/SMTP credentials
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USERNAME: "noreply@neuropredict.ai"
  SMTP_PASSWORD: "CHANGE_ME_SMTP_PASSWORD"
  
  # Third-party API keys
  AWS_ACCESS_KEY_ID: "YOUR_AWS_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "YOUR_AWS_SECRET_KEY"
  
  # Monitoring
  GRAFANA_ADMIN_PASSWORD: "CHANGE_ME_GRAFANA_PASSWORD"

---
# Create secrets using kubectl:
# kubectl create secret generic neuropredict-secrets \
#   --from-literal=DATABASE_URL='postgresql+asyncpg://...' \
#   --from-literal=SECRET_KEY='...' \
#   --namespace=neuropredict

---
# Or use sealed-secrets for GitOps:
# kubeseal --format=yaml < secrets-template.yaml > sealed-secrets.yaml

