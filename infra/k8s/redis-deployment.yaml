apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: neuropredict
    tier: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neuropredict
      tier: cache
  template:
    metadata:
      labels:
        app: neuropredict
        tier: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: neuropredict
    tier: cache
spec:
  selector:
    app: neuropredict
    tier: cache
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP


