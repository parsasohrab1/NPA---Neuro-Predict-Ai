apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neuropredict-ingress
  namespace: neuropredict-ai
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
spec:
  tls:
  - hosts:
    - api.neuropredict-ai.com
    - neuropredict-ai.com
    - admin.neuropredict-ai.com
    secretName: neuropredict-tls
  rules:
  - host: api.neuropredict-ai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: neuropredict-backend
            port:
              number: 8000
  - host: neuropredict-ai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: neuropredict-frontend
            port:
              number: 80
  - host: admin.neuropredict-ai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: neuropredict-admin
            port:
              number: 80

